<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AvaPlay TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Roboto+Condensed:wght@700&family=Roboto+Mono:wght@700&family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/css/tokens.css">
  <link rel="stylesheet" href="./src/css/app.css">
  <link rel="stylesheet" href="./src/css/movies.css">
  <link rel="stylesheet" href="./src/css/setup.css">
  <link rel="stylesheet" href="./src/css/remote.css">
</head>
<body>
  <!-- On a Samsung TV the native player (AVPlay) comes from webapis.js, which only exists there -->
  <script>
    if (/Tizen/i.test(navigator.userAgent)) {
      document.write('<script src="$WEBAPIS/webapis/webapis.js"><\/script>');
      document.write('<object id="av-player" type="application/avplayer" style="position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:-2;pointer-events:none"></object>');
    }
  </script>
  <div id="app">
    <div id="app-bg" class="app-bg"></div>
    <!-- 1. TOP HEADER (Matches Android TV) -->
    <header class="tv-header">
      <div class="header-left">
        <!-- SVG Logo from logo/Avaplay horizontal.svg -->

                <stop offset=".64" stop-color="#d62027"/>
                <stop offset=".7" stop-color="#cc1e24"/>
                <stop offset=".79" stop-color="#b31a1f"/>
                <stop offset=".91" stop-color="#891416"/>
                <stop offset="1" stop-color="#650f0e"/>
              </linearGradient>
            </defs>

              <path fill="#e01f28" d="M15.35,41.68c-3.97,6.1-5.99,10.69-6.39,14.53-.53,5.08,1.73,9.89,7.22,10.7,9.29,1.38,24.02-9.56,30.23-13.39,10.27-6.33,19.29-1.04,22.37,10.12,4.44-14.88-8.06-28.82-27.06-20.72-4.55,1.94-9.11,3.89-13.67,5.83-6.86,2.93-14.85,1.71-12.7-7.08Z"/>
              <path fill="url(#logo-grad)" d="M15.35,41.78c4.14-7.21,8.92-15.89,13.4-22.7,2.98-4.52,6.36-8.35,9.77-8.4,5.71-.08,7.99,4.79,10.46,9.01,3.78,6.45,7.08,12.75,10.88,19.51-6.3-2.09-9.66-1.63-16.4.45-2.58-4.78-5.5-10.78-10.3-1.8l-5.05,10.99c-6.34,2.7-15.01,2.17-12.76-7.06Z"/>
              <path fill="#c9252c" d="M15.35,41.68c-3.97,6.1-5.99,10.69-6.39,14.53-.53,5.08,1.73,9.89,7.22,10.7,9.29,1.38,24.02-9.56,30.23-13.39,10.27-6.33,19.29-1.04,22.37,10.12,4.44-14.88-8.06-28.82-27.06-20.72-4.55,1.94-9.11,3.89-13.67,5.83-6.86,2.93-14.85,1.71-12.7-7.08Z"/>
              <path fill="#c9252c" d="M55.49,53.56c-2.41,0-4.95.81-7.55,2.42-.88.54-1.94,1.24-3.13,2.01,2.58.25,4.84,1.06,6.54,2.49,3.17,2.68,6.45,6.31,10.2,6.78,2.11.26,4.55-.09,6.07-1.64-2.15-6.66-6.94-12.06-12.12-12.06Z"/>
            </g>
            <g>
              <path fill="#c9252c" d="M113.24,55.27h-6.82l-3.12-6.09-7.45-14.62-7.45,14.62-3.12,6.09h-6.82l3.12-6.09,14.27-28.01,14.27,28.01,3.12,6.09Z"/>
              <path fill="#c9252c" d="M138.57,21.17l-3.12,6.09-14.27,28.01-14.27-28.01-3.12-6.09h6.82l3.12,6.09,7.45,14.62,7.45-14.62,3.12-6.09h6.82Z"/>
              <path fill="#c9252c" d="M164,55.27h-6.82l-3.12-6.09-7.45-14.62-7.45,14.62-3.12,6.09h-6.82l3.12-6.09,14.27-28.01,14.27,28.01,3.12,6.09Z"/>
              <path fill="#ffffff" d="M189.38,31.63c0,1.51-.26,2.91-.79,4.2-.53,1.29-1.26,2.41-2.21,3.35-1.18,1.18-2.56,2.06-4.17,2.64-1.6.59-3.62.88-6.07.88h-4.53v12.71h-4.53V21.33h9.25c2.05,0,3.78.17,5.2.52,1.42.34,2.68.88,3.78,1.61,1.3.87,2.3,1.95,3.01,3.25.71,1.3,1.06,2.94,1.06,4.92ZM184.67,31.75c0-1.18-.21-2.2-.62-3.07s-1.04-1.58-1.88-2.13c-.73-.47-1.57-.81-2.51-1.02-.94-.21-2.13-.31-3.56-.31h-4.49v13.62h3.82c1.83,0,3.32-.16,4.46-.49,1.14-.33,2.08-.85,2.79-1.57.72-.73,1.22-1.5,1.52-2.31.3-.81.45-1.72.45-2.72Z"/>
              <path fill="#ffffff" d="M199.36,55.42h-4.3V21.17h4.3v34.25Z"/>
              <path fill="#ffffff" d="M227.75,55.42h-4.28v-2.72c-.38.26-.9.62-1.55,1.09-.65.47-1.28.84-1.89,1.11-.72.35-1.54.64-2.47.88s-2.02.36-3.27.36c-2.3,0-4.26-.76-5.86-2.29-1.6-1.53-2.4-3.47-2.4-5.84,0-1.94.42-3.51,1.25-4.7.83-1.2,2.02-2.14,3.56-2.83,1.56-.69,3.43-1.15,5.61-1.4,2.18-.24,4.52-.43,7.03-.55v-.66c0-.98-.17-1.79-.51-2.43-.34-.64-.84-1.14-1.48-1.51-.61-.35-1.34-.59-2.2-.71-.85-.12-1.75-.18-2.68-.18-1.13,0-2.39.15-3.78.45-1.39.3-2.82.73-4.3,1.29h-.23v-4.37c.84-.23,2.05-.48,3.64-.76,1.59-.27,3.15-.41,4.69-.41,1.8,0,3.37.15,4.7.45,1.34.3,2.49.81,3.47,1.52.96.7,1.69,1.61,2.2,2.72.5,1.11.76,2.5.76,4.14v17.35ZM223.47,49.12v-7.12c-1.31.08-2.86.19-4.64.34-1.78.15-3.19.37-4.22.66-1.24.35-2.24.9-3,1.64-.76.74-1.14,1.76-1.14,3.06,0,1.47.44,2.57,1.33,3.31.88.74,2.24,1.11,4.05,1.11,1.51,0,2.89-.29,4.14-.88,1.25-.59,2.41-1.29,3.48-2.12Z"/>
              <path fill="#ffffff" d="M257.78,29.85l-14.93,35h-4.6l4.76-10.67-10.19-24.33h4.67l7.85,18.95,7.92-18.95h4.51Z"/>
            </g>
          </svg>
        </div>

        <!-- Top Navigation Tabs -->
        <nav class="header-nav">
          <button id="tab-livetv" class="header-tab active" data-view="livetv"><span>Live TV</span></button>
          <button id="tab-movies" class="header-tab" data-view="movies"><span>Movies</span></button>
          <button id="tab-series" class="header-tab" data-view="series"><span>TV Shows</span></button>
        </nav>
      </div>

      <!-- Header Right Action Icons -->
      <div class="header-actions">
        <button id="btn-filter" class="header-icon-btn" title="Sort & Filter">
          <svg viewBox="0 0 24 24" width="44" height="44" fill="currentColor">
            <path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/>
          </svg>
        </button>
        <button id="btn-settings" class="header-icon-btn" title="Settings">
          <svg viewBox="0 0 24 24" width="44" height="44" fill="currentColor">
            <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 2. MAIN STAGE -->
    <main class="tv-main">
      <!-- LIVE TV (matches the Android TV Live TV screen) -->
      <section id="view-livetv" class="view-panel active">
        <div id="livetv-layout" class="livetv-layout">
          <!-- Left: group list -->
          <aside class="category-drawer" id="category-drawer">
            <div id="category-list" class="category-list"></div>
          </aside>

          <!-- Right: preview, channel info and the guide -->
          <div class="livetv-stage">
            <div class="preview-stage-row">
              <div id="preview-box" class="preview-video-box"></div>

              <div class="preview-channel-details">
                <div class="channel-headline">
                  <h1 id="live-channel-name">TOP CHANNEL HD</h1>
                  <button id="btn-favorite-star" class="star-btn" title="Toggle favourite">
                    <svg viewBox="0 0 24 24"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                  </button>
                </div>
                <p id="live-guide-subtitle" class="channel-guide-subtitle"></p>
                <div id="live-group-label" class="live-group-label"></div>
              </div>
            </div>

            <div class="guide">
              <div class="timeline-header-row">
                <div id="timeline-clock" class="timeline-clock"></div>
                <div id="timeline-ticks" class="timeline-ticks"></div>
              </div>
              <div class="timeline-ruler"></div>
              <div id="timeline-cursor" class="timeline-cursor"><i></i></div>
              <div id="guide-rows" class="guide-rows" data-empty="false"></div>
              <div id="epg-empty-notice" class="epg-empty-notice">
                No favourite channels yet. Hold OK on a channel and choose Favourite.
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="view-movies" class="view-panel"></section>

      <section id="view-settings" class="view-panel">
        <div class="placeholder-view"><h2>Settings</h2><p>Press Back to return to Live TV.</p></div>
      </section>
    </main>

    <!-- 3. FULLSCREEN PLAYER -->
    <div id="player-fullscreen-osd" class="fs-osd">
      <div class="fs-top">
        <span id="fs-group" class="fs-group"></span>
        <span id="fs-clock" class="fs-clock"></span>
      </div>
      <div id="fs-status" class="fs-status">Opening stream…</div>
      <div id="fs-spinner" class="fs-spinner"></div>

      <div id="fs-bottom" class="fs-bottom">
        <div class="fs-info">
          <div id="fs-logo" class="fs-logo"></div>
          <div class="fs-info-text">
            <h2 id="fs-channel-title"></h2>
            <div class="fs-meta"><span id="fs-prog" class="fs-prog">No information</span><b id="fs-num"></b></div>
          </div>
        </div>
        <div class="fs-progress"><i id="fs-progress-bar"></i></div>
      </div>

      <!-- Channel strip: TV guide, History and recent channels (D-pad Right / OK) -->
      <div id="fs-recents" class="fs-strip">
        <div id="fs-recents-list" class="fs-strip-list"></div>
        <svg class="fs-chevron" viewBox="0 0 24 24"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
      </div>
    </div>

    <!-- History side panel -->
    <div id="fs-history" class="fs-history">
      <div class="fs-history-title">History</div>
      <div id="fs-history-list" class="fs-history-list"></div>
    </div>

    <!-- Player options menu (D-pad Down from the strip) -->
    <div id="fs-menu" class="fs-menu">
      <div id="fs-menu-list" class="fs-menu-list"></div>
      <div id="fs-menu-sub" class="fs-menu-sub"></div>
    </div>

    <!-- Modal dialog (long-press OK on a channel, sort & filter) -->
    <div id="dialog" class="dialog-scrim">
      <div class="dialog">
        <h3 id="dialog-title"></h3>
        <div id="dialog-list" class="dialog-list"></div>
      </div>
    </div>

    <div id="fs-toast" class="fs-toast"></div>
  </div>

  <script type="module" src="./src/index.js"></script>
</body>
</html>
